name: CI

on:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate package metadata
        run: |
          bun -e '
          import { readFileSync } from "node:fs";

          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const assertEqual = (actual, expected, label) => {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${label} mismatch`);
            }
          };

          const tetaPackage = readJson("packages/teta/package.json");
          const tetaJsr = readJson("packages/teta/jsr.json");
          assertEqual(tetaPackage.name, tetaJsr.name, "@teta/teta name");
          assertEqual(tetaPackage.version, tetaJsr.version, "@teta/teta version");
          assertEqual(tetaPackage.exports, tetaJsr.exports, "@teta/teta exports");

          const devPackage = readJson("packages/dev/package.json");
          const devJsr = readJson("packages/dev/jsr.json");
          const devDeno = readJson("packages/dev/deno.json");
          assertEqual(devPackage.name, devJsr.name, "@teta/dev jsr name");
          assertEqual(devPackage.version, devJsr.version, "@teta/dev jsr version");
          assertEqual(devPackage.exports, devJsr.exports, "@teta/dev jsr exports");
          assertEqual(devPackage.name, devDeno.name, "@teta/dev deno name");
          assertEqual(devPackage.version, devDeno.version, "@teta/dev deno version");
          assertEqual(devPackage.exports["."], devDeno.exports, "@teta/dev deno exports");

          console.log("package metadata ok");
          '
      - name: Run check
        run: bun run check

  runtime-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - bun
          - node
          - deno
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: current
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run runtime smoke test
        run: bun run test:runtime:${{ matrix.runtime }}

  bench-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run benchmark regression check
        run: bun run bench:render:check

  jsr-dry-run-teta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/teta
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate @teta/teta publish bundle
        run: bunx jsr publish --dry-run --allow-dirty

  jsr-dry-run-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate @teta/dev publish bundle
        run: bunx jsr publish --dry-run --allow-dirty
