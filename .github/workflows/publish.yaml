name: Publish
on:
  push:
    branches:
      - master

jobs:
  detect-release-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sql: ${{ steps.detect.outputs.sql }}
      teta: ${{ steps.detect.outputs.teta }}
      dev: ${{ steps.detect.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi

          if git diff --quiet "$before" "$GITHUB_SHA" -- packages/sql/package.json packages/sql/jsr.json; then
            if ! git diff --quiet "$before" "$GITHUB_SHA" -- packages/sql; then
              echo "::error::@teta/sql changed without a package version/manifest change";
              exit 1;
            fi
            echo "sql=false" >> "$GITHUB_OUTPUT"
          else
            echo "sql=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$before" "$GITHUB_SHA" -- packages/teta/package.json packages/teta/jsr.json; then
            if ! git diff --quiet "$before" "$GITHUB_SHA" -- packages/teta; then
              echo "::error::@teta/teta changed without a package version/manifest change";
              exit 1;
            fi
            echo "teta=false" >> "$GITHUB_OUTPUT"
          else
            echo "teta=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$before" "$GITHUB_SHA" -- packages/dev/package.json packages/dev/jsr.json packages/dev/deno.json; then
            if ! git diff --quiet "$before" "$GITHUB_SHA" -- packages/dev; then
              echo "::error::@teta/dev changed without a package version/manifest change";
              exit 1;
            fi
            echo "dev=false" >> "$GITHUB_OUTPUT"
          else
            echo "dev=true" >> "$GITHUB_OUTPUT"
          fi

  publish-sql:
    needs: detect-release-changes
    if: needs.detect-release-changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.12
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Publish @teta/sql
        run: bunx jsr publish

  publish-teta:
    needs:
      - detect-release-changes
      - publish-sql
    if: always() && needs.detect-release-changes.outputs.teta == 'true' && (needs.publish-sql.result == 'success' || needs.publish-sql.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/teta
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.12
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Publish @teta/teta
        run: bunx jsr publish

  publish-dev:
    needs: detect-release-changes
    if: needs.detect-release-changes.outputs.dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.12
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Publish @teta/dev
        run: bunx jsr publish
